# Render Blueprint — see DEPLOY.md for the full walkthrough.
# Deploy with: Render dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: fleetshield
    runtime: node
    plan: free
    # preDeployCommand would be cleaner for this, but it's a paid-plan-only
    # Render feature — folding the migration into the build step instead.
    # Safe to run on every deploy: the migration SQL is idempotent
    # (CREATE ... IF NOT EXISTS throughout).
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Timescale Cloud connection string in the Render dashboard
      - key: DB_WRITE_EVERY_N_TICKS
        value: "3"    # throttles position writes to protect free-tier DB storage
      - key: NODE_VERSION
        value: 20.18.0
      - key: ADMIN_USERNAME
        sync: false   # set in the Render dashboard
      - key: ADMIN_PASSWORD_HASH
        sync: false   # output of: npm run hash-password -- "your-password"
      - key: SESSION_SECRET
        generateValue: true   # Render generates and stores a random secret for you
