<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleet Shield — Admin Login</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <span class="cursor">_</span>JEGA<span class="sec">SEC</span>
      </div>
      <div class="login-product">Fleet Shield</div>

      <form id="loginForm">
        <div id="passwordStep">
          <label>Username
            <input type="text" id="username" name="username" autocomplete="username" required autofocus />
          </label>
          <label>Password
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit" id="loginBtn">Sign in</button>
          <div class="login-error" id="loginError"></div>
          <p class="signup-footnote">New here? <a href="/signup.html">Create an account</a></p>
        </div>
      </form>

      <form id="mfaForm" class="hidden">
        <div id="mfaStep">
          <div class="otp-label">Enter the 6-digit code from your authenticator app</div>
          <div class="otp-row" id="otpRow">
            <input type="text" class="otp-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
            <input type="text" class="otp-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2" />
            <input type="text" class="otp-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3" />
            <input type="text" class="otp-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4" />
            <input type="text" class="otp-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5" />
            <input type="text" class="otp-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 6" />
          </div>
          <button type="submit" id="mfaBtn">Verify</button>
          <div class="login-error" id="mfaError"></div>
        </div>
      </form>
    </div>
    <div class="login-footnote">JEGASEC Defence Technologies Pty Ltd</div>
  </div>

  <script src="login.js"></script>
</body>
</html>
