<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleet Shield — Admin Login</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <span class="cursor">_</span>JEGA<span class="sec">SEC</span>
      </div>
      <div class="login-product">Fleet Shield</div>
      <div class="login-eyebrow">— Admin Access</div>

      <form id="loginForm">
        <label>Username
          <input type="text" id="username" name="username" autocomplete="username" required autofocus />
        </label>
        <label>Password
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" id="loginBtn">Sign in</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
    <div class="login-footnote">JEGASEC Defence Technologies Pty Ltd</div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Sign-in failed. Check your credentials and try again.';
      } catch (err) {
        errorEl.textContent = 'Network error — could not reach the server.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
